version: "2"

run:
  timeout: 5m

linters:
  enable:
    - depguard
    - nolintlint
  settings:
    depguard:
      rules:
        mocks:
          deny:
            - pkg: github.com/golang/mock
              desc: mocks are prohibited, use a fake (.shampoo/rules/mocks.toml)
            - pkg: go.uber.org/mock
              desc: mocks are prohibited, use a fake (.shampoo/rules/mocks.toml)
            - pkg: github.com/stretchr/testify/mock
              desc: mocks are prohibited, use a fake (.shampoo/rules/mocks.toml)
            - pkg: github.com/vektra/mockery
              desc: mocks are prohibited, use a fake (.shampoo/rules/mocks.toml)
            - pkg: github.com/gojuno/minimock
              desc: mocks are prohibited, use a fake (.shampoo/rules/mocks.toml)
            - pkg: github.com/maxbrunsfeld/counterfeiter
              desc: mocks are prohibited, use a fake (.shampoo/rules/mocks.toml)
            - pkg: github.com/DATA-DOG/go-sqlmock
              desc: mocks are prohibited, use a fake (.shampoo/rules/mocks.toml)
            - pkg: github.com/jarcoal/httpmock
              desc: mocks are prohibited, use a fake (.shampoo/rules/mocks.toml)
            - pkg: github.com/h2non/gock
              desc: mocks are prohibited, use a fake (.shampoo/rules/mocks.toml)
    nolintlint:
      require-explanation: true
      require-specific: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/toms74209200/shampoo
