name: Job - Commit scenarios

on:
  workflow_call:
    inputs:
      base:
        description: 'Commit the range starts after'
        required: true
        type: string
      head:
        description: 'Last commit of the range'
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Check that no commit changes scenarios with production code
        env:
          BASE: ${{ inputs.base }}
          HEAD: ${{ inputs.head }}
        run: |
          result=0
          for c in $(git rev-list --reverse --no-merges "$BASE..$HEAD"); do
            scripts/check-scenario-commit.sh --rev "$c" || { s=$?; [ $s -gt $result ] && result=$s; }
          done
          exit $result
