name: Job - Test Small (Go)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Install strace
        run: sudo apt-get install -y strace
      - name: Run small tests
        run: make test-small
      - name: Judge side effects
        run: scripts/judge-side-effects.sh out/traces
      - uses: actions/upload-artifact@v7
        with:
          name: small-cover
          path: out/small.cover
