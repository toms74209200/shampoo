name: Job - Check scenarios

on:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Check scenario annotations
        run: make check-scenarios
      - name: Record @sha of each scenario
        run: scripts/check-scenarios.sh --write
      - name: Commit @sha
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am ":white_check_mark: Update @sha of scenarios"
          git pull --rebase origin ${{ github.head_ref }}
          git push
