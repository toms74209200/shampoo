name: On Push

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  commit-message:
    uses: ./.github/workflows/job-commit-message.yml
    with:
      base: ${{ github.event.before }}
      head: ${{ github.sha }}
  commit-check:
    uses: ./.github/workflows/job-commit-check.yml
    with:
      base: ${{ github.event.before }}
      head: ${{ github.sha }}
