name: On Pull Request (Python)

on:
  pull_request:
    branches:
      - master
    paths:
      - 'tests/acceptance/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  acceptance-test:
    uses: ./.github/workflows/job-test-acceptance.yml
