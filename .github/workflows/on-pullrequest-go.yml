name: On Pull Request (Go)

on:
  pull_request:
    branches:
      - master
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.golangci.yml'
      - '.github/workflows/on-pullrequest-go.yml'
      - '.github/workflows/job-lint-go.yml'
      - '.github/workflows/job-test-small-go.yml'
      - '.github/workflows/job-check-exceptions.yml'
      - 'scripts/check-exceptions.sh'
      - '.github/workflows/job-check-dependencies.yml'
      - 'scripts/check-dependencies.sh'
      - 'scripts/allowed-modules.txt'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    uses: ./.github/workflows/job-lint-go.yml
    permissions:
      contents: write
  small-test:
    uses: ./.github/workflows/job-test-small-go.yml
  exceptions:
    uses: ./.github/workflows/job-check-exceptions.yml
  dependencies:
    uses: ./.github/workflows/job-check-dependencies.yml
