name: On Pull Request (Go)

on:
  pull_request:
    branches:
      - master
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/job-build-go.yml
  lint:
    needs: [build]
    uses: ./.github/workflows/job-lint-go.yml
    permissions:
      contents: write
  small-test:
    needs: [build]
    uses: ./.github/workflows/job-test-small-go.yml
  coverage:
    needs: [small-test, lint]
    uses: ./.github/workflows/job-coverage-go.yml
    permissions:
      contents: write
