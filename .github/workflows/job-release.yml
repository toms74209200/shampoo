name: Job - Release

on:
  workflow_call:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Build binaries
        run: |
          mkdir -p dist
          for target in linux:amd64:linux-x86_64 linux:arm64:linux-aarch64 darwin:arm64:macos-aarch64; do
            os=${target%%:*}
            rest=${target#*:}
            arch=${rest%%:*}
            name=${rest#*:}
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "dist/shampoo-$name" .
          done
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --generate-notes dist/*
