name: Job - Coverage (Go)

on:
  workflow_call:

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          name: small-cover
          path: out
      - name: Judge small-test coverage
        run: scripts/judge-small-test-coverage.sh out/small.cover
      - name: Judge coverage against the base
        run: scripts/judge-coverage.sh out/small.cover ${{ github.event.pull_request.base.sha }} --update
      - name: Commit coverage baseline
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am ":white_check_mark: Update coverage baseline"
          git pull --rebase origin ${{ github.head_ref }}
          git push
