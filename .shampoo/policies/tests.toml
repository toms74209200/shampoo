text = '''
Code and tests are two sides of one thing. Tests are as many small tests
as possible.
- Code with side effects is tested by medium or larger tests, written knowing their cost
- A server whose code is mostly CRUD may have few small tests; coverage is counted across all sizes
- DAMP over DRY
- A value whose content does not matter to the test is generated by a property-based test (`testing/quick`, or fuzz targets whose seeds run as tests)
- A value that is itself the condition under test, such as a boundary, is a case of a parameterized test table
- Arrange-Act-Assert
- Mutation testing shows whether tests assert: on a PR it runs on the changed lines; at a milestone, on everything'''
