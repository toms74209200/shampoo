review = true
text = '''
Recognize it by: input from outside the program.

Write it as: at the boundary where the input enters, parse it into a
value of its own type, which says it is valid. Inside the boundary, pass
that type, not the raw input, and do not check it again.

Instead of:
```ts
const toPort = (s: string): number => Number(s);
if (port > 0 && port < 65536) { ... }
```

Tests no longer needed: every caller's re-check of the range.'''
example = '''
Ideal:
```ts
type Port = number & { readonly brand: "Port" };
const parsePort = (s: string): Port | ParseError => ...;
```
In Go, a named type returned by the parse function:
```go
type Port uint16
func ParsePort(s string) (Port, error)
```
A named type does not stop a conversion such as `Port(70000)`, and need
not: what is asked is the parse at the boundary and no check inside, not
that the type cannot be made otherwise.'''
