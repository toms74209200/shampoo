rule = "Mocks are prohibited. Fakes stand in for what has side effects."
check = "scripts/lint.sh"
transitions = ["edit", "task", "pr"]
paths = ["**.go", "go.mod", "go.sum", "scripts/lint.sh", "scripts/golangci-lint.sh", ".golangci.yml"]
size = "small"
exit = { 1 = "task-failure", other = "workflow-failure" }
