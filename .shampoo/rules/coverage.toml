rule = "The share of pure code, the small-test coverage of the whole code base, does not drop more than one standard deviation below the base's; a drop charges this rule's budget (docs/design.md §3)."
check = "small-tests"
transitions = ["pr"]
paths = ["**.go", "go.mod", "go.sum", "scripts/judge-coverage.sh", "scripts/coverage-baseline.txt"]
judge = { command = "scripts/judge-coverage.sh <base> out/small.cover", exit = { 3 = "budget", other = "workflow-failure" } }
budget = { violations = 2, runs = 20 }
