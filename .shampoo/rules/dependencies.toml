rule = "Every module the code depends on is in the project's allowlist, with its reason. Changing the allowlist goes through human review."
check = "make check-dependencies"
transitions = ["edit", "task", "pr"]
paths = ["**.go", "go.mod", "go.sum", "scripts/check-dependencies.sh", "scripts/allowed-modules.txt"]
size = "small"
exit = { 1 = "task-failure", other = "workflow-failure" }
