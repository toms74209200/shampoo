rule = "A white-box test depends on its target only. If the target is a function, no other production code is used, except the types needed to build its arguments."
check = "make check-white-box"
transitions = ["edit", "task", "pr"]
paths = ["**.go", "scripts/check-white-box.sh", "tools/**"]
size = "small"
exit = { 1 = "task-failure", other = "workflow-failure" }
