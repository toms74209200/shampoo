rule = "Side effects, as defined by test sizes, are statements in the packages designated for them."
check = "make check-side-effects"
transitions = ["edit", "task", "pr"]
paths = ["**.go", "go.mod", "go.sum", "scripts/trace-exec.sh", "scripts/judge-side-effects.sh"]
size = "small"
exit = { 1 = "task-failure", other = "workflow-failure" }
