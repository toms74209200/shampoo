rule = "Every scenario whose @sha is missing or does not match its content carries @skip (docs/design.md §5.1)."
check = "scenarios"
transitions = ["edit", "task", "pr"]
paths = ["features/**", "scripts/check-scenarios.sh", "tools/**", "scripts/list-files.sh"]
judge = { exit = { 1 = "task-failure", other = "workflow-failure" } }
