rule = "Comments are prohibited in all code, test code included. Directives are not comments and are allowed: `//go:` directives, build constraints, `// Code generated`, and `//nolint:<linter> // <reason>`."
check = "comments"
transitions = ["edit", "task", "pr"]
paths = ["**.go", "scripts/check-comments.sh", "tools/**", "scripts/list-files.sh"]
judge = { exit = { 1 = "task-failure", other = "workflow-failure" } }
