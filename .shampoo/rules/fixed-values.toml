rule = "Literal values in tests appear only in the cases of a parameterized test table."
check = "fixed-values"
transitions = ["edit", "task", "pr"]
paths = ["**_test.go", "scripts/check-fixed-values.sh", "tools/**", "scripts/list-files.sh"]
judge = { exit = { 1 = "task-failure", other = "workflow-failure" } }
