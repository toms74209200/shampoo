rule = "Small-test coverage of the code outside the side-effect packages is at least 95%."
check = "scripts/judge-small-test-coverage.sh out/small.cover"
transitions = ["task", "pr"]
paths = ["**.go", "go.mod", "go.sum", "scripts/judge-small-test-coverage.sh", "scripts/side-effect-packages.txt"]
size = "small"
exit = { 1 = "task-failure", other = "workflow-failure" }
